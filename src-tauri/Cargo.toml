[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-log = "2"
# 划词与截图：全局快捷键、读写剪贴板、模拟按键复制选中的文字、将剪贴板图片编码为 PNG
tauri-plugin-global-shortcut = "2"
arboard = "3"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"
# 长期记忆：SQLite（bundled 会编译内置的 SQLite，无需另外安装）
rusqlite = { version = "0.43", features = ["bundled"] }
# 网页搜索：不受跨域限制的 HTTP 请求；用系统浏览器打开链接、在文件夹中显示文件
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
# 本地文件：规范化路径（避免 Windows 的 UNC 前缀）、识别 GBK 等编码、读取 docx / pptx
dunce = "1"
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# 本地文件：读取 PDF 与表格（xlsx / xls / ods）
pdf-extract = "0.12"
calamine = { version = "0.38", features = ["dates"] }
# PDF：按页重新组合（合并、拆分、旋转）。pdf-extract 已经依赖同一版本，不启用默认特性以免多编译
lopdf = { version = "0.42", default-features = false }
# Word / PowerPoint：解析 XML（calamine 已经依赖同一版本与特性）
quick-xml = { version = "0.42", features = ["encoding"] }
# 把表格中的日期格式化为文字（calamine 的 dates 特性使用 chrono，格式化需要 alloc 特性）
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# 系统诊断：CPU、内存、进程、网络、磁盘的状态
sysinfo = { version = "0.40", default-features = false, features = ["system", "network", "disk"] }

[target.'cfg(windows)'.dependencies]
# 系统诊断：用 DXGI 获取显卡名称与显存总量（tauri、sysinfo 已经依赖 windows 0.62，这里只多打开一个特性）
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }
# Graphics_Gdi 与 System_SystemInformation 用于主动交互：判断前台窗口是否全屏、用户空闲了多久
# Graphics_Dwm 用于应用与窗口管理：跳过被系统隐藏的窗口、计算窗口四周透明边框的大小
# System_Performance、System_Power 用于系统诊断：GPU 占用与显存（性能计数器）、电池状态
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_HiDpi", "Win32_Globalization", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_Graphics_Dwm", "Win32_System_Performance", "Win32_System_Power"] }

# 截取指定窗口（「看屏幕」技能）。Linux 上依赖 pipewire 等系统库，暂不启用
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap = "0.9"


# 开发构建中也优化图片编码相关的依赖，否则大尺寸截图编码 PNG 会明显变慢
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.image]
opt-level = 3
