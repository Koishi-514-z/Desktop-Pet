[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-log = "2"
# 划词与截图：全局快捷键、读写剪贴板、模拟按键复制选中的文字、将剪贴板图片编码为 PNG
tauri-plugin-global-shortcut = "2"
arboard = "3"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"
# 长期记忆：SQLite（bundled 会编译内置的 SQLite，无需另外安装）
rusqlite = { version = "0.43", features = ["bundled"] }
# 网页搜索：不受跨域限制的 HTTP 请求；用系统浏览器打开链接、在文件夹中显示文件
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
# 本地文件：规范化路径（避免 Windows 的 UNC 前缀）、识别 GBK 等编码、读取 docx / pptx
dunce = "1"
encoding_rs = "0.8"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# 本地文件：读取 PDF 与表格（xlsx / xls / ods）
pdf-extract = "0.12"
calamine = { version = "0.38", features = ["dates"] }
# 把表格中的日期格式化为文字（calamine 的 dates 特性使用 chrono，格式化需要 alloc 特性）
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_HiDpi", "Win32_Globalization", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp"] }

# 截取指定窗口（「看屏幕」技能）。Linux 上依赖 pipewire 等系统库，暂不启用
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap = "0.9"


# 开发构建中也优化图片编码相关的依赖，否则大尺寸截图编码 PNG 会明显变慢
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.image]
opt-level = 3
